[project]
name = "prometheus-ai"
version = "0.1.0"
description = "Approval-gated incident-response agent for Kubernetes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Varun Nair" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0,<7.0",
  "markdown>=3.7,<4.0",
  "langgraph>=1.2,<2.0",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary,pool]>=3.2,<4.0",
  "pgvector>=0.3,<1.0",
]
graph = [
  "langgraph>=1.2,<2.0",
  "langgraph-checkpoint-postgres>=3.0,<4.0",
]

bedrock = ["boto3>=1.35,<2.0"]
mcp = ["mcp>=1.8,<2.0"]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.7,<1.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
prometheus-ai = "prometheus_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
  "live: tests that need a real cluster or cloud model",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = [
  "S101",     # asserts are fine in tests
  "S105",     # dev-only token defaults are validated and rejected outside dev
  "S106",     # test fixtures pass obviously fake tokens to constructors
  "E501",     # line length is handled by review; avoids noisy wrap churn
  "ASYNC109", # explicit timeout parameters are part of the executor contract
  "ASYNC240", # eval report writes are short, synchronous file operations
]
