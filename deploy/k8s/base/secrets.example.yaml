# TEMPLATE ONLY. Do not apply this file.
#
# Create the real secrets out of band, from generated values:
#
#   kubectl -n prometheus-ai create secret generic prometheus-ai-secrets \
#     --from-literal=approver-token="$APPROVER_TOKEN" \
#     --from-literal=webhook-token="$WEBHOOK_TOKEN" \
#     --from-literal=database-url="postgresql://prometheus_ai:$PG_PASSWORD@prometheus-ai-postgres.data.svc.cluster.local:5432/prometheus_ai?sslmode=disable"
#
#   kubectl -n data create secret generic prometheus-ai-secrets \
#     --from-literal=postgres-password="$PG_PASSWORD"
#
#   kubectl -n policy create secret generic policy-secrets \
#     --from-literal=policy-token="$POLICY_TOKEN" \
#     --from-literal=approver-token="$APPROVER_TOKEN" \
#     --from-literal=webhook-token="$WEBHOOK_TOKEN"
#
# Why the policy service also needs approver/webhook values: Settings refuses to
# start outside dev unless those are non-default. The policy process never uses
# them; supplying them keeps one validation rule for every component.
#
#   kubectl -n monitoring create secret generic monitoring-secrets \
#     --from-literal=webhook-token="$WEBHOOK_TOKEN"
#
# The agent and policy tokens are different credentials with different powers:
#   * approver-token  human decision API
#   * webhook-token   Alertmanager -> agent intake
#   * policy-token    agent -> policy service (the only write gate)
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-ai-secrets
  namespace: prometheus-ai
type: Opaque
stringData:
  approver-token: REPLACE_ME
  webhook-token: REPLACE_ME
  database-url: postgresql://prometheus_ai:REPLACE_ME@prometheus-ai-postgres.data.svc.cluster.local:5432/prometheus_ai
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-ai-secrets
  namespace: data
type: Opaque
stringData:
  postgres-password: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: policy-secrets
  namespace: policy
type: Opaque
stringData:
  policy-token: REPLACE_ME
  approver-token: REPLACE_ME
  webhook-token: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secrets
  namespace: monitoring
type: Opaque
stringData:
  webhook-token: REPLACE_ME
