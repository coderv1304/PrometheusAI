apiVersion: v1
kind: ConfigMap
metadata:
  name: policy-config
  namespace: policy
data:
  PROMETHEUS_AI_ENV: production
  PROMETHEUS_AI_INVENTORY_BACKEND: kubectl
  PROMETHEUS_AI_POLICY_MODE: inprocess
  PROMETHEUS_AI_DRY_RUN: "false"
  PROMETHEUS_AI_ENABLE_DOCS: "false"
  PROMETHEUS_AI_ALLOWED_NAMESPACES: '["demo"]'
  PROMETHEUS_AI_ALLOWED_ACTIONS: '["rollout_restart","scale","rollout_undo"]'
  PROMETHEUS_AI_MAX_WRITES_PER_HOUR: "3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-ai-policy
  namespace: policy
  labels:
    app: prometheus-ai-policy
    app.kubernetes.io/part-of: prometheus-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-ai-policy
  template:
    metadata:
      labels:
        app: prometheus-ai-policy
        app.kubernetes.io/part-of: prometheus-ai
    spec:
      serviceAccountName: prometheus-ai-policy
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: policy
          image: prometheusai:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["policy-serve", "--host", "0.0.0.0", "--port", "8081"]
          envFrom:
            - configMapRef:
                name: policy-config
          env:
            - name: PROMETHEUS_AI_POLICY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: policy-secrets
                  key: policy-token
            - name: PROMETHEUS_AI_APPROVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: policy-secrets
                  key: approver-token
            - name: PROMETHEUS_AI_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: policy-secrets
                  key: webhook-token
          ports:
            - name: http
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: state
              mountPath: /app/.prometheus-ai
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-ai-policy
  namespace: policy
  labels:
    app: prometheus-ai-policy
spec:
  selector:
    app: prometheus-ai-policy
  ports:
    - name: http
      port: 8081
      targetPort: http
