apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus-ai-postgres
  namespace: data
  labels:
    app: prometheus-ai-postgres
    app.kubernetes.io/part-of: prometheus-ai
spec:
  serviceName: prometheus-ai-postgres
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-ai-postgres
  template:
    metadata:
      labels:
        app: prometheus-ai-postgres
        app.kubernetes.io/part-of: prometheus-ai
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: prometheus_ai
            - name: POSTGRES_USER
              value: prometheus_ai
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prometheus-ai-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "prometheus_ai", "-d", "prometheus_ai"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "prometheus_ai", "-d", "prometheus_ai"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-ai-postgres
  namespace: data
  labels:
    app: prometheus-ai-postgres
spec:
  selector:
    app: prometheus-ai-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
