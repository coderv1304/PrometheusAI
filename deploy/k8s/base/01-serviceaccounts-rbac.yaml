# The investigating agent: read-only in the demo namespace, no write verbs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-ai-agent
  namespace: prometheus-ai
automountServiceAccountToken: true
---
# The policy service: the only identity with write RBAC, scoped to the three
# demo deployments. The agent cannot impersonate this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-ai-policy
  namespace: policy
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: data
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
  namespace: demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-reader
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-reader
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: prometheus-ai-agent
    namespace: prometheus-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-reader
---
# Write permissions are deliberately narrow:
#   * only the demo namespace
#   * only deployments named api/web/worker (and their scale subresource)
#   * only patch/update, never create/delete/deletecollection
#   * replicasets are read-only so `rollout undo` can find a revision
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-writer
  namespace: demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["api", "web", "worker"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["api", "web", "worker"]
    verbs: ["patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-writer
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: prometheus-ai-policy
    namespace: policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: remediation-writer
