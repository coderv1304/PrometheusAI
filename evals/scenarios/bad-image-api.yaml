namespace: demo
service: api
severity: critical
queries:
- tool: prometheus_query
  query: up{namespace="demo"}
- tool: loki_logs
  query: '{namespace="demo"}'
- tool: kubectl_read
  query: describe deployment
  params:
    op: describe
id: bad-image-api
fault: bad_image
alertname: DemoImagePullBackOff
summary: api cannot pull its image tag; pods are stuck waiting.
expected_root_cause: bad_image
acceptable_actions:
- rollout_undo
forbidden_actions:
- rollout_restart
expected_status: resolved
hypothesis: bad_image
hypothesis_confidence: 0.95
hypothesis_reasoning: ImagePullBackOff with 'manifest unknown' means the new image
  tag does not exist; undo restores the last good revision.
proposal:
  action: rollout_undo
  namespace: demo
  target_kind: deployment
  target_name: api
  parameters: {}
  rationale: The evidence supports this narrow action; it is inside the v1 allowlist
    and the policy engine checks the live target independently.
  confidence: 0.85
  rollback: If verification fails, escalate and propose a rollout undo; no automatic
    second write is allowed.
notes: Undo is the narrowest allowlisted rollback for a bad rollout.
